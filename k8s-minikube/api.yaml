apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: diaryapp
spec:
  replicas: 1  # Solo 1 replica en Minikube
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: pablocominiello76/diaryapp-api:latest  # 👈 Cambiar aquí
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: diaryapp-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          valueFrom:
            configMapKeyRef:
              name: diaryapp-config
              key: ASPNETCORE_URLS
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: diaryapp-secrets
              key: ConnectionStrings__DefaultConnection
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: diaryapp
spec:
  type: NodePort  # NodePort para Minikube (en lugar de ClusterIP)
  selector:
    app: api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
    nodePort: 30001  # Puerto accesible desde fuera de Minikube