services:
  # ========================================
  # SQL Server
  # ========================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: diaryapp-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "MySecure#Pass2024!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - diaryapp-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'MySecure#Pass2024!' -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ========================================
  # API
  # ========================================
  api:
    build:
      context: .
      dockerfile: DiaryApp.Api/Dockerfile
    container_name: diaryapp-api
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=DiaryAppDb;User Id=sa;Password=MySecure#Pass2024!;TrustServerCertificate=True;
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - diaryapp-network
    restart: unless-stopped

  # ========================================
  # Web App
  # ========================================
  webapp:
    build:
      context: .
      dockerfile: DiaryApp/Dockerfile
    container_name: diaryapp-webapp
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__defaultConnection=Server=sqlserver;Database=DiaryAppDb;User Id=sa;Password=MySecure#Pass2024!;TrustServerCertificate=True;
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - diaryapp-network
    restart: unless-stopped

networks:
  diaryapp-network:
    driver: bridge

volumes:
  sqlserver-data: