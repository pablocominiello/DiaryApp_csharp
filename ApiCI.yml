trigger:
- master

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  publishDir: '$(Build.ArtifactStagingDirectory)/publish'
  packageZip: '$(Build.ArtifactStagingDirectory)/DiaryApp.zip'
  webAppName: 'dev-DiaryApp'
  azureServiceConnection: 'Suscripción 1(2eabbc77-bdf5-4d85-8f86-0738b59fa7a8)'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 9 SDK'
    inputs:
      packageType: 'sdk'
      version: '9.0.x'
      includePreviewVersions: true

  - script: dotnet --version
    displayName: 'Verify .NET version'

  - task: DotNetCoreCLI@2
    displayName: 'Publish DiaryApp'
    inputs:
      command: 'publish'
      projects: 'DiaryApp/DiaryApp.csproj'
      arguments: '--configuration $(buildConfiguration) --output $(publishDir) --self-contained false'
      publishWebProjects: false
      zipAfterPublish: true

  - powershell: |
      Write-Host "=== Content of Publish Directory ==="
      if (Test-Path "$(publishDir)") {
        Get-ChildItem -Path "$(publishDir)" -Recurse | Format-Table FullName, Length -AutoSize
        
        Write-Host "`n=== Searching for DiaryApp.dll ==="
        $dll = Get-ChildItem -Path "$(publishDir)" -Recurse -Filter "DiaryApp.dll"
        if ($dll) {
          Write-Host "✅ SUCCESS: DiaryApp.dll found at: $($dll.FullName)"
        } else {
          Write-Host "❌ ERROR: DiaryApp.dll NOT FOUND"
          Write-Host "`nAll DLL files found:"
          Get-ChildItem -Path "$(publishDir)" -Recurse -Filter "*.dll" | Format-Table FullName
          exit 1
        }
      } else {
        Write-Host "❌ ERROR: Publish directory does not exist!"
        exit 1
      }
    displayName: 'Validate publish output'

  - task: ArchiveFiles@2
    displayName: 'Create ZIP package'
    inputs:
      rootFolderOrFile: '$(publishDir)'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(packageZip)'
      replaceExistingArchive: true
      verbose: true

  - task: AzureWebApp@1
    displayName: 'Deploy to Azure'
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      appType: 'webApp'
      appName: '$(webAppName)'
      package: '$(packageZip)'
      deploymentMethod: 'zipDeploy'
