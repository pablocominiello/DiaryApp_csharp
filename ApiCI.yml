trigger:
- master

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  publishDir: '$(Build.ArtifactStagingDirectory)/publish'
  packageZip: '$(Build.ArtifactStagingDirectory)/DiaryApp.zip'
  webAppName: 'prod-DiaryApp'
  azureServiceConnection: 'Suscripción 1(2eabbc77-bdf5-4d85-8f86-0738b59fa7a8)'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      version: '9.0.x'
      includePreviewVersions: true

  - task: DotNetCoreCLI@2
    displayName: 'Restore dependencies'
    inputs:
      command: 'restore'
      projects: |
        DiaryApp/DiaryApp.csproj
        DiaryApp.Core/DiaryApp.Core.csproj
        DiaryApp.Shared/DiaryApp.Shared.csproj

  - task: DotNetCoreCLI@2
    displayName: 'Build project'
    inputs:
      command: 'build'
      projects: 'DiaryApp/DiaryApp.csproj'
      arguments: '--configuration $(buildConfiguration) --no-restore'

  - task: DotNetCoreCLI@2
    displayName: 'Publish project'
    inputs:
      command: 'publish'
      projects: 'DiaryApp/DiaryApp.csproj'
      arguments: '--configuration $(buildConfiguration) --output $(publishDir) --no-build'
      publishWebProjects: false
      zipAfterPublish: false

  - powershell: |
      Write-Host "=== Publish Directory Contents ==="
      Get-ChildItem -Path "$(publishDir)" -Recurse | Select-Object FullName, Length
      
      Write-Host "`n=== Checking for DiaryApp.dll ==="
      $dllPath = Join-Path "$(publishDir)" "DiaryApp.dll"
      if (Test-Path $dllPath) {
        Write-Host "✅ DiaryApp.dll found at: $dllPath"
      } else {
        Write-Host "❌ DiaryApp.dll NOT FOUND!"
        exit 1
      }
      
      Write-Host "`n=== Checking for web.config ==="
      $webConfigPath = Join-Path "$(publishDir)" "web.config"
      if (Test-Path $webConfigPath) {
        Write-Host "✅ web.config found"
        Get-Content $webConfigPath
      } else {
        Write-Host "⚠️ web.config NOT FOUND (will be generated by Azure)"
      }
    displayName: 'Validate publish output'

  - task: ArchiveFiles@2
    displayName: 'Create deployment package'
    inputs:
      rootFolderOrFile: '$(publishDir)'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(packageZip)'
      replaceExistingArchive: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publish artifact for review'
    inputs:
      PathtoPublish: '$(packageZip)'
      ArtifactName: 'drop'

  - task: AzureWebApp@1
    displayName: 'Deploy to Azure App Service'
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      appType: 'webApp'
      appName: '$(webAppName)'
      package: '$(packageZip)'
      deploymentMethod: 'zipDeploy'
